  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/animations.css">

  <!-- JSON-LD Structured Data Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Kishore M",
    "jobTitle": "AI & Data Science Student",
    "url": "https://github.com/Kishore-2207",

  }
  </script>

  <!-- Theme Script (Loaded early to prevent FOUC) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Header / Navigation Bar -->
  <header id="header" class="site-header" role="banner">
    <!-- Navbar placeholder: Will be populated dynamically by JS component -->
    <div class="nav-placeholder" aria-hidden="true"></div>
  </header>

  <!-- Main Content Landmark -->
  <main id="main-content" role="main">

    <!-- HERO SECTION -->
    <section id="hero" class="hero-section" aria-label="Introduction Section">
      <!-- Hero placeholder: Monogram logo, title, intro text, CTA buttons, scroll indicator, animated gradients -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- ABOUT SECTION -->
    <section id="about" class="about-section section-padding" aria-label="About Me Section">
      <!-- About placeholder: Biography, stats grid, timeline, objective cards -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- SKILLS SECTION -->
    <section id="skills" class="skills-section section-padding" aria-label="Skills and Tech Stack Section">
      <!-- Skills placeholder: Category filter tabs, search input, skill cards with animated progress meters -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- PROJECTS SECTION -->
    <section id="projects" class="projects-section section-padding" aria-label="Projects Portfolio Section">
      <!-- Projects placeholder: Live search, tag filters, projects cards, GitHub repositories integration -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- EXPERIENCE SECTION -->
    <section id="experience" class="experience-section section-padding" aria-label="Work Experience Section">
      <!-- Experience placeholder: Chronological vertical timeline cards (workshops, internships, job nodes) -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- CERTIFICATIONS SECTION -->
    <section id="certifications" class="certifications-section section-padding" aria-label="Certifications Gallery Section">
      <!-- Certifications placeholder: Cert cards gallery, download buttons, interactive category toggle -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact" class="contact-section section-padding" aria-label="Contact Section">
      <!-- Contact placeholder: Validation form, email link, address, contact socials -->
      <div class="section-loader" aria-hidden="true">
        <span class="spinner"></span>
      </div>
    </section>

  </main>

  <!-- Site Footer Landmark -->
  <footer id="footer" class="site-footer" role="contentinfo">
    <!-- Footer placeholder: Copyright details, dynamic date, links, quick buttons -->
    <div class="footer-placeholder" aria-hidden="true"></div>
  </footer>

  <!-- Modal Preview Window for Certifications -->
  <div id="cert-modal" class="modal-wrapper" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-overlay"></div>
    <div class="modal-container">
      <button class="modal-close-btn" aria-label="Close modal"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-body">
        <h2 id="modal-title" class="modal-title"></h2>
        <div class="modal-content-area"></div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Wrapper -->
  <div id="toast-container" class="toast-wrapper" aria-live="polite" aria-atomic="true"></div>

  <!-- Core Javascript Modules Entry Point -->
  <script type="module" src="./js/main.js"></script>

</body>
</html>
